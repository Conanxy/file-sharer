[package]
name = "file-sharer"
version = "0.0.3"
description = "LAN-only drag and drop file sharing"
authors = ["fang"]
edition = "2021"

[lib]
name = "file_sharer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSString"] }
