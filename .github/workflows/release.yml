name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    name: Build desktop (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x64
            runner: windows-latest
            args: ""
          - name: macos-universal
            runner: macos-latest
            args: "--target universal-apple-darwin"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        if: matrix.platform.name != 'macos-universal'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust for macOS universal
        if: matrix.platform.name == 'macos-universal'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build desktop bundle
        run: npm run tauri -- build ${{ matrix.platform.args }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-sharer-${{ matrix.platform.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.app.tar.gz
            src-tauri/target/**/bundle/**/*.app.tar.gz.sig
            src-tauri/target/**/bundle/**/*.nsis.zip
            src-tauri/target/**/bundle/**/*.nsis.zip.sig
            src-tauri/target/**/bundle/**/*.msi.zip
            src-tauri/target/**/bundle/**/*.msi.zip.sig

  android:
    name: Build Android arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.1.12297006"

      - name: Install Android build tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Android APK
        run: npm run tauri -- android build --target aarch64 --apk --split-per-abi --ci
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006

      - name: Sign Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing Android signing secrets"
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing/release.jks
          unsigned_apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*arm64*unsigned*.apk' -type f | head -n 1)"
          if [ -z "$unsigned_apk" ]; then
            echo "Unsigned Android arm64 APK not found"
            find src-tauri/gen/android/app/build/outputs/apk -type f | sort
            exit 1
          fi
          signed_apk="src-tauri/gen/android/app/build/outputs/apk/File-Sharer-${{ github.ref_name }}-android-arm64-signed.apk"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo "apksigner not found"
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f | sort
            exit 1
          fi
          "$apksigner_path" sign \
            --ks signing/release.jks \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$signed_apk" \
            "$unsigned_apk"
          "$apksigner_path" verify --verbose --print-certs "$signed_apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-sharer-android-arm64
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/apk/*signed.apk

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - desktop
      - android

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f -maxdepth 6 | sort

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t assets < <(find release-assets -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi
          printf '%s\n' "${assets[@]}"
          gh release delete "${{ github.ref_name }}" --yes || true
          gh release create "${{ github.ref_name }}" "${assets[@]}" \
            --title "File Sharer ${{ github.ref_name }}" \
            --notes "File Sharer ${{ github.ref_name }}

            Tested manually only on Android arm64 and macOS Apple Silicon M4.
            Windows, macOS Intel, and other environments are automatically built but not manually tested." \
            --prerelease
